spring.application.name=server
spring.jpa.hibernate.ddl-auto=validate

# In-memory by default, so a bare run leaves no database file behind carrying
# credentials that live in version control. Point DB_URL at a real database for
# anything that needs to survive a restart, or run with --spring.profiles.active=dev
# for a local file-backed database and the H2 console.
spring.datasource.url=${DB_URL:jdbc:h2:mem:iudex;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# The console is a database shell. It stays off unless something turns it on.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Secrets. Blank means a random key is generated for this run only, which lets a
# local server start with no setup. Set both before deploying -- see the README.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Shared with the judging client, which decrypts test inputs and encrypts the
# outputs it reports back.
iudex.testcase.secret=${IUDEX_TESTCASE_SECRET:}

iudex.storage.root=${IUDEX_STORAGE_ROOT:./storage}

# The first administrator, created at startup only when no administrator exists.
# Leave blank to have a password generated and logged once.
iudex.admin.username=${IUDEX_ADMIN_USERNAME:}
iudex.admin.password=${IUDEX_ADMIN_PASSWORD:}
