name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A new push to a PR cancels the previous run; pushes
# to main are left alone so every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Confirms gradle-wrapper.jar is a genuine Gradle release. The jar is a
      # binary we execute on every run, so it is worth checking it was not
      # swapped out.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The build declares a Java 23 toolchain. Installing it here means Gradle
      # finds it locally instead of downloading a JDK through foojay.
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      # Handles the Gradle build cache and dependency cache. It only writes the
      # cache from the default branch, so PRs read it without poisoning it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build = assemble + check, so this compiles, runs the unit tests and the
      # integrationTest suite, and builds the distribution.
      - name: Build and test
        run: ./gradlew build

      # Test reports are only interesting when something broke, and the HTML
      # report says far more than the failure lines in the log.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
